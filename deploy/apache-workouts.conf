# /etc/apache2/sites-available/workouts.cmon1975.com.conf
#
# Tailnet-scoped vhost: Apache picks the most-specific <VirtualHost ip:port>
# for each incoming connection. Requests arriving on the public droplet IP
# match the existing *:80 / *:443 vhosts for other sites; only connections
# arriving on the tailscale IP match these blocks, so workouts is
# unreachable from outside the tailnet even though apache listens on
# 0.0.0.0:{80,443}.
#
# No `Listen` directives here: ports.conf already has both. A second Listen
# is a duplicate bind and breaks apache reload.
#
# Cert: workouts.cmon1975.com is issued via certbot-dns-cloudflare DNS-01
# because the host is not publicly reachable (HTTP-01 needs a public path).
# Renewal runs automatically via the certbot systemd timer.
#
# deploy/install-apache.sh substitutes __TAILSCALE_IP__ before installing.

<VirtualHost __TAILSCALE_IP__:80>
    ServerName workouts.cmon1975.com
    DocumentRoot /var/www/workouts/public

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,R=301]

    ErrorLog  ${APACHE_LOG_DIR}/workouts-http-error.log
    CustomLog ${APACHE_LOG_DIR}/workouts-http-access.log combined
</VirtualHost>

<VirtualHost __TAILSCALE_IP__:443>
    ServerName workouts.cmon1975.com
    DocumentRoot /var/www/workouts/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/workouts.cmon1975.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/workouts.cmon1975.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/workouts/public>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    LimitRequestBody 262144

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /api/ http://127.0.0.1:8787/api/
    ProxyPassReverse /api/ http://127.0.0.1:8787/api/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/workouts-error.log
    CustomLog ${APACHE_LOG_DIR}/workouts-access.log combined
</VirtualHost>
